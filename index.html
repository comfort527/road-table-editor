(()=>{const P=JSON.parse(document.getElementById('payload').textContent),K='road-editor-unlock:v1',$=id=>document.getElementById(id);

async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:d64(P.salt),iterations:P.iter},base,256)}
async function open(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.iv)},key,d64(P.data));const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}
