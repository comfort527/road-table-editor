<style>
:root{font-family:"Segoe UI","Microsoft JhengHei",sans-serif;color:#2b2a33;background:#f6f3ee}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#f6f3ee}
form{background:#fffdfa;border:1px solid #ebe5da;border-radius:24px;padding:30px 28px 24px;width:min(380px,calc(100vw - 32px));box-sizing:border-box;box-shadow:0 18px 50px -18px #3a2d1a40;text-align:center}
.logo{width:68px;height:68px;margin:0 auto 14px;display:block;border-radius:16px;box-shadow:0 8px 20px -8px #176a7099}
h1{margin:0 0 4px;font-size:24px;letter-spacing:.5px}p{margin:0 0 20px;color:#6b6a72;font-size:15px}
input[type=password]{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:11px 14px;border:1px solid #d9d2c6;border-radius:12px;background:#fff;color:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
input[type=password]:focus{border-color:#1f7a6c;box-shadow:0 0 0 3px #1f7a6c26}
label.r{display:flex;gap:8px;align-items:center;margin:14px 2px 18px;font-size:15px;color:#5a5962;text-align:left;cursor:pointer}
label.r input{width:18px;height:18px;accent-color:#1f7a6c;margin:0}
button{width:100%;font:inherit;font-size:18px;font-weight:600;padding:11px;border:0;border-radius:999px;background:#1f7a6c;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .08s}
button:hover{background:#17665a}button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.7;cursor:default}
.busy button::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid #ffffff66;border-top-color:#fff}
#msg{min-height:1.4em;margin-top:12px;font-size:15px;color:#ad3d40}
@media(prefers-reduced-motion:no-preference){
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes spin{to{transform:rotate(360deg)}}
form{animation:in .3s ease-out}form.shake{animation:shake .32s ease-in-out}
.busy button::before{animation:spin .7s linear infinite}
}

const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),e64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:d64(P.salt),iterations:P.iter},base,256)}
async function open(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:d64(P.iv)},key,d64(P.data));const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}
function store(){try{return JSON.parse(localStorage.getItem(K)||'null')}catch{return null}}
$('f').onsubmit=async e=>{e.preventDefault();const pw=$('pw').value;if(!pw)return;$('go').disabled=true;$('f').classList.remove('shake');$('f').classList.add('busy');$('msg').style.color='#6b6a72';$('msg').textContent='解密中…';try{const raw=await derive(pw);if($('rem').checked)try{localStorage.setItem(K,JSON.stringify({salt:P.salt,key:e64(raw)}))}catch{}await open(raw)}catch{$('go').disabled=false;$('f').classList.remove('busy');void $('f').offsetWidth;$('f').classList.add('shake');$('msg').style.color='#ad3d40';$('msg').textContent='密碼錯誤';$('pw').select()}};
(async()=>{if(!window.crypto?.subtle||!window.DecompressionStream){$('f').hidden=false;$('msg').textContent='此瀏覽器不支援，請改用新版 Chrome、Edge 或 Safari';$('go').disabled=true;return}const s=store();if(s&&s.salt===P.salt){try{await open(d64(s.key));return}catch{}}if(s)try{localStorage.removeItem(K)}catch{}$('f').hidden=false;$('pw').focus()})()})();
</script></body></html>
